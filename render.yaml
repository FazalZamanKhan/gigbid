# Optional hosted development preview. Not a substitute for the full local Compose stack.
services:
  - type: web
    name: gigbid-preview
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/public.Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GIGBID_MARKETPLACE
        value: demo_mcp
      - key: GIGBID_CHECKPOINT_BACKEND
        value: postgres
      - key: LANGGRAPH_STRICT_MSGPACK
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: gigbid-preview-db
          property: connectionString
      - key: GIGBID_REVIEWER_USERNAME
        value: reviewer
      - key: GIGBID_REVIEWER_PASSWORD
        sync: false

databases:
  - name: gigbid-preview-db
    plan: free
    databaseName: gigbid
    user: gigbid
