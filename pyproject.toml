[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gigbid"
version = "0.1.0"
description = "GigBid freelancer copilot — pre-starter development build"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.38.0",
  "pydantic==2.14.2",
  "httpx==0.28.1",
  "langgraph==1.2.19",
  "mcp==1.30.0",
  "langchain-mcp-adapters==0.3.2",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.3.0"]

[tool.setuptools.packages.find]
include = ["agent*", "apps*", "rag*", "mcp_servers*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "mcp_servers"]
